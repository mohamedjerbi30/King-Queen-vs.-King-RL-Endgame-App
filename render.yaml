# Render blueprint for the backend (Flask API + WebSockets).
# The frontend can stay on Vercel: set VITE_API_BASE there to this service's URL.
services:
  - type: web
    name: kqk-endgame-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Memory: ~0.4 GB at rest (DP tables), around 1 GB while an exact test runs -> 2 GB instance (Render "standard").
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
